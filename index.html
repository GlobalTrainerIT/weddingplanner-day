    {
      "@context": "https://schema.org",

        {
          "@type": "Question",

          "@type": "Question",
          "name": "Is Vow free?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. Vow is free to start with no credit card required. The free plan includes the full master checklist, budget tracker with categories and deposits, up to 25 guests, up to 5 vendors, notes and journal, and your wedding overview. Pro ($15/month or $99/year) unlocks unlimited guests and vendors, seating chart, bridal party, day timeline, honeymoon planner, PDF exports, and partner collaboration." }

          "@type": "Question",
          "name": "Can my partner and I plan together?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes — with Vow Pro. You can invite your partner to co-plan in real time. Both of you can add guests, check off tasks, and update the budget from your own devices." }
        },
        {
          "@type": "Question",
          "name": "Can wedding planners use Vow with clients?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. Vow has a dedicated Planner Dashboard (Pro) that lets professional planners manage multiple client weddings, switch between them, and collaborate with each couple." }
        },
        {
          "@type": "Question",
          "name": "Is my data private?",
          "acceptedAnswer": { "@type": "Answer", "text": "Absolutely. Your wedding data is protected by row-level security — you can only ever see your own wedding. We do not sell your data or use it for advertising." }
        },
        {
          "@type": "Question",
          "name": "Does Vow work on my phone?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. Vow is fully responsive and works well on any modern smartphone browser — no app download required." }
        },
        {
          "@type": "Question",
          "name": "Can guests RSVP online?",
          "acceptedAnswer": { "@type": "Answer", "text": "Online guest RSVP is coming soon. Currently you collect RSVPs manually in the Guest List and update statuses yourself." }
        }
      ]
    }

      <div class="seo-landing">
        <h1>Plan your entire wedding in one beautiful place.</h1>
        <p>Vow brings your guest list, budget, seating chart, vendors, and wedding-day timeline together — so nothing slips through the cracks. Free to start. 9 planning modules. Private &amp; secure.</p>

        <h2>Wedding Planning App Features</h2>

        <h3>Master Checklist</h3>
        <p>A 48-task wedding planning checklist covering every decision from 18 months out to your wedding day, organized by timeframe so you always know what to do next.</p>

        <h3>Budget Tracker</h3>
        <p>Track every wedding expense by category, log deposits, and see your balance due at a glance. A spending breakdown shows exactly where your money is going.</p>

        <h3>Guest List &amp; RSVPs</h3>
        <p>Manage up to 25 guests free. Track RSVP status, meal choices, dietary restrictions, plus-ones, invite sent, and thank-you notes in one place.</p>

        <h3>Seating Chart</h3>
        <p>Create named tables with capacity limits. Assign confirmed guests with one click and see which seats are filled or empty.</p>

        <h3>Vendor Manager</h3>
        <p>Track every wedding vendor — photographer, caterer, florist, DJ, and more. Log quotes, deposits, and contract status.</p>

        <h3>Day-of Timeline</h3>
        <p>Build a minute-by-minute schedule for your wedding day and share it with your vendors.</p>

        <h3>Bridal Party Manager</h3>
        <p>Track bridesmaids and groomsmen with outfit details, gift ideas, and responsibilities.</p>

        <h3>Honeymoon Planner</h3>
        <p>Plan your post-wedding escape alongside the wedding itself.</p>

        <h3>Notes &amp; Journal</h3>
        <p>A private space for inspiration, vendor research, and wedding-day reflections.</p>

        <h2>Pricing</h2>
        <h3>Free Plan — $0</h3>
        <ul>
          <li>Up to 25 guests</li>
          <li>Up to 5 vendors</li>
          <li>Full master checklist</li>
          <li>Budget tracker with categories and deposits</li>
          <li>Notes and journal</li>
        </ul>
        <h3>Pro Plan — $15/month or $99/year</h3>
        <ul>
          <li>Unlimited guests and vendors</li>
          <li>Seating chart builder</li>
          <li>Bridal party manager</li>
          <li>Day timeline builder</li>
          <li>Honeymoon planner</li>
          <li>PDF export of all sections</li>
          <li>Partner collaboration (real-time)</li>
        </ul>

        <h2>Frequently Asked Questions</h2>
        <h3>What is Vow?</h3>
        <p>Vow is an all-in-one wedding planning app with checklist, budget tracker, guest list, seating chart, vendor manager, day-of timeline, bridal party manager, and honeymoon planner.</p>
        <h3>Is Vow free?</h3>
        <p>Yes. Vow is free to start with no credit card required. Pro is $15/month or $99/year.</p>
        <h3>Can my partner and I plan together?</h3>
        <p>Yes — with Vow Pro you can invite your partner to co-plan in real time.</p>
        <h3>Does Vow work on my phone?</h3>
        <p>Yes. Vow is fully responsive and works on any modern smartphone browser.</p>
